<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寶物分贓計算器</title>
    <!-- 引入 Tailwind CSS 確保排版美觀 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- 標題區 -->
        <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">⚔️ 隊伍寶物分贓計算器</h1>
                <p class="text-sm text-slate-500 mt-1">公平分帳，買家自食其果（買家無法均分自己買裝的錢）</p>
            </div>
            <div class="flex gap-2 w-full md:w-auto">
                <button onclick="loadSample()" class="flex-1 md:flex-none px-4 py-2 text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl transition">載入範例</button>
                <button onclick="resetAll()" class="flex-1 md:flex-none px-4 py-2 text-sm bg-rose-50 hover:bg-rose-100 text-rose-600 font-medium rounded-xl transition">全部重設</button>
            </div>
        </header>

        <!-- 區塊一：成員管理 (支援文字批次匯入) -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <span>👥</span> 隊伍成員設定
                </h2>
                <span id="memberCountBadge" class="text-xs bg-indigo-50 text-indigo-600 font-semibold px-2.5 py-1 rounded-full">共 0 人</span>
            </div>

            <!-- 批次文字匯入區塊 -->
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                <div class="flex justify-between items-center">
                    <label class="text-sm font-semibold text-slate-700">快速批次文字匯入</label>
                    <span class="text-xs text-slate-500">支援空白、換行、逗號、頓號分隔</span>
                </div>
                <textarea id="batchInput" rows="2" placeholder="例如: 玩家A 玩家B 玩家C 玩家D (或直接貼上一行/換行名單)" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white"></textarea>
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="flex items-center gap-4 text-sm">
                        <label class="flex items-center gap-1.5 cursor-pointer">
                            <input type="radio" name="importMode" value="replace" checked class="text-indigo-600 focus:ring-indigo-500">
                            <span>覆蓋現有名單</span>
                        </label>
                        <label class="flex items-center gap-1.5 cursor-pointer">
                            <input type="radio" name="importMode" value="append" class="text-indigo-600 focus:ring-indigo-500">
                            <span>追加到現有名單</span>
                        </label>
                    </div>
                    <button onclick="batchImportMembers()" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition shadow-sm">
                        一鍵匯入名單
                    </button>
                </div>
            </div>

            <!-- 單一新增與清單 -->
            <div class="flex gap-2">
                <input type="text" id="newMemberName" placeholder="輸入單個隊員名稱 (例如: 亞瑟)" onkeypress="if(event.key==='Enter') addMember()" class="flex-1 px-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                <button onclick="addMember()" class="px-5 py-2 bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium rounded-xl transition">新增成員</button>
            </div>

            <!-- 成員標籤清單 -->
            <div id="memberList" class="flex flex-wrap gap-2 pt-2">
                <!-- 動態生成 -->
            </div>
        </section>

        <!-- 區塊二：寶物登記區 -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <span>💎</span> 寶物登記與分配
                </h2>
                <button onclick="addItem()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-xl transition shadow-sm flex items-center gap-1">
                    <span>+</span> 新增寶物
                </button>
            </div>

            <div id="itemList" class="space-y-3">
                <!-- 動態生成寶物卡片 -->
            </div>
        </section>

        <!-- 區塊三：最終結算總表 -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                <span>📊</span> 最終結算總表
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-500 text-xs font-semibold uppercase tracking-wider">
                            <th class="py-3 px-4">成員</th>
                            <th class="py-3 px-4">買裝總花費</th>
                            <th class="py-3 px-4">分紅總收益</th>
                            <th class="py-3 px-4 text-right">最終結算 (淨收支)</th>
                        </tr>
                    </thead>
                    <tbody id="summaryTableBody" class="divide-y divide-slate-100 text-sm">
                        <!-- 動態生成 -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- 區塊四：一鍵複製頻道通知 -->
        <section class="bg-gradient-to-br from-slate-900 to-indigo-950 text-white p-6 rounded-2xl shadow-md space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold flex items-center gap-2">
                    <span>📋</span> 隊伍頻道結算通知
                </h2>
                <button onclick="copyDiscordReport()" class="px-5 py-2.5 bg-indigo-500 hover:bg-indigo-600 text-white text-sm font-semibold rounded-xl transition shadow-sm flex items-center gap-2">
                    <span>📄</span> 複製結算明細文字
                </button>
            </div>
            <textarea id="reportOutput" readonly rows="5" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl p-3 text-xs md:text-sm font-mono text-slate-200 focus:outline-none resize-none" placeholder="點擊上方按鈕生成可直接貼到 Discord / Line 的明細..."></textarea>
        </section>

    </div>

    <!-- JavaScript 邏輯與千分位格式化 -->
    <script>
        // 資料結構
        let state = {
            members: [],
            items: []
        };

        // 千分位格式化函式
        function formatNumber(num) {
            if (num === '' || isNaN(num)) return '';
            return Number(num).toLocaleString('en-US');
        }

        // 解析帶逗號的數字字串為純數字
        function parseNumber(str) {
            if (!str) return 0;
            const cleaned = str.toString().replace(/,/g, '');
            const val = parseFloat(cleaned);
            return isNaN(val) ? 0 : val;
        }

        // 綁定輸入框即時千分位轉換
        function handlePriceInput(inputElem, itemId) {
            let rawVal = parseNumber(inputElem.value);
            // 更新資料狀態
            const item = state.items.find(i => i.id === itemId);
            if (item) {
                item.price = rawVal;
                calculate();
            }
            // 游標保持與格式化呈現
            // 為了輸入流暢，只在失焦或數值確定後完整格式化，或者即時格式化
            const cursorPosition = inputElem.selectionStart;
            inputElem.value = rawVal === 0 && inputElem.value === '' ? '' : formatNumber(rawVal);
        }

        // 初始化載入
        window.onload = function() {
            loadFromLocalStorage();
            if (state.members.length === 0 && state.items.length === 0) {
                loadSample();
            } else {
                renderAll();
            }
        };

        function saveToLocalStorage() {
            localStorage.setItem('loot_calculator_state', JSON.stringify(state));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('loot_calculator_state');
            if (saved) {
                try { state = JSON.parse(saved); } catch(e) {}
            }
        }

        function resetAll() {
            if (confirm('確定要清空所有成員與寶物資料嗎？')) {
                state = { members: [], items: [] };
                saveToLocalStorage();
                renderAll();
            }
        }

        function loadSample() {
            state.members = ["玩家A", "玩家B", "玩家C", "玩家D"];
            state.items = [
                { id: 1, name: "傳說之劍", price: 1000000, buyer: "玩家A" },
                { id: 2, name: "防禦護符", price: 200000, buyer: "" }
            ];
            saveToLocalStorage();
            renderAll();
        }

        // 成員管理
        function addMember() {
            const input = document.getElementById('newMemberName');
            const name = input.value.trim();
            if (!name) return;
            if (state.members.includes(name)) {
                alert('此成員已經存在！');
                return;
            }
            state.members.push(name);
            input.value = '';
            saveToLocalStorage();
            renderAll();
        }

        function removeMember(name) {
            state.members = state.members.filter(m => m !== name);
            // 同時清除寶物買家中包含此人的設定
            state.items.forEach(item => {
                if (item.buyer === name) item.buyer = "";
            });
            saveToLocalStorage();
            renderAll();
        }

        // 批次匯入成員
        function batchImportMembers() {
            const text = document.getElementById('batchInput').value;
            if (!text.trim()) {
                alert('請先輸入要匯入的名單文字！');
                return;
            }

            // 支援空白、換行、逗號、頓號、Tab 分隔
            const rawNames = text.split(/[\s,\，、\t\n]+/);
            const newNames = [...new Set(rawNames.map(n => n.trim()).filter(n => n.length > 0))];

            if (newNames.length === 0) {
                alert('沒有解析到有效的成員名稱！');
                return;
            }

            const mode = document.querySelector('input[name="importMode"]:checked').value;

            if (mode === 'replace') {
                state.members = newNames;
            } else {
                // 追加並去除重複
                const combined = [...state.members, ...newNames];
                state.members = [...new Set(combined)];
            }

            document.getElementById('batchInput').value = '';
            saveToLocalStorage();
            renderAll();
        }

        // 寶物管理
        function addItem() {
            const newItem = {
                id: Date.now(),
                name: `寶物 ${state.items.length + 1}`,
                price: 0,
                buyer: ""
            };
            state.items.push(newItem);
            saveToLocalStorage();
            renderAll();
        }

        function removeItem(id) {
            state.items = state.items.filter(i => i.id !== id);
            saveToLocalStorage();
            renderAll();
        }

        function updateItemField(id, field, value) {
            const item = state.items.find(i => i.id === id);
            if (item) {
                if (field === 'price') {
                    item.price = parseNumber(value);
                } else {
                    item[field] = value;
                }
                saveToLocalStorage();
                renderCalculationOnly(); // 局部重新計算顯示，不破壞輸入焦點
            }
        }

        // 渲染全部
        function renderAll() {
            renderMembers();
            renderItems();
            calculate();
        }

        function renderMembers() {
            const badge = document.getElementById('memberCountBadge');
            badge.innerText = `共 ${state.members.length} 人`;

            const container = document.getElementById('memberList');
            if (state.members.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 italic">尚未加入任何隊員，請透過上方文字批次匯入或單個新增。</p>`;
                return;
            }

            container.innerHTML = state.members.map(m => `
                <div class="inline-flex items-center gap-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-xl text-sm transition">
                    <span class="font-medium">${m}</span>
                    <button onclick="removeMember('${m}')" class="text-slate-400 hover:text-rose-600 font-bold px-1">&times;</button>
                </div>
            `).join('');
        }

        function renderItems() {
            const container = document.getElementById('itemList');
            if (state.items.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 border border-dashed border-slate-200 rounded-xl text-sm">目前沒有登記寶物，請點擊上方「+ 新增寶物」</div>`;
                return;
            }

            container.innerHTML = state.items.map(item => `
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col md:flex-row gap-3 items-start md:items-center justify-between">
                    <div class="flex flex-col md:flex-row gap-3 w-full md:w-auto flex-1">
                        <input type="text" value="${item.name}" oninput="updateItemField(${item.id}, 'name', this.value)" placeholder="寶物名稱" class="px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none w-full md:w-48">
                        
                        <div class="relative flex-1 md:w-40">
                            <input type="text" value="${item.price ? formatNumber(item.price) : ''}" oninput="handlePriceInput(this, ${item.id})" placeholder="售出價格" class="px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none w-full text-right pr-8">
                            <span class="absolute right-3 top-2.5 text-xs text-slate-400 pointer-events-none">元</span>
                        </div>

                        <select onchange="updateItemField(${item.id}, 'buyer', this.value)" class="px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none w-full md:w-44">
                            <option value="">-- 無人買 (直接變現) --</option>
                            ${state.members.map(m => `<option value="${m}" ${item.buyer === m ? 'selected' : ''}>${m} 內購自留</option>`).join('')}
                        </select>
                    </div>

                    <div class="flex items-center justify-between w-full md:w-auto gap-4">
                        <div id="item-hint-${item.id}" class="text-xs text-slate-500 font-medium"></div>
                        <button onclick="removeItem(${item.id})" class="text-rose-500 hover:text-rose-700 text-sm font-medium px-2 py-1">刪除</button>
                    </div>
                </div>
            `).join('');

            calculate();
        }

        // 計算核心與總表呈現
        function calculate() {
            renderCalculationOnly();
        }

        function renderCalculationOnly() {
            const totalMembersCount = state.members.length;
            
            // 初始化結算結構
            let stats = {};
            state.members.forEach(m => {
                stats[m] = { spent: 0, earned: 0, net: 0 };
            });

            // 逐筆寶物計算
            state.items.forEach(item => {
                const price = Number(item.price) || 0;
                const buyer = item.buyer;
                const hintElem = document.getElementById(`item-hint-${item.id}`);

                if (totalMembersCount === 0) {
                    if (hintElem) hintElem.innerText = `⚠️ 尚無隊员`;
                    return;
                }

                if (!buyer) {
                    // 情況A：無人購買，全體平分
                    const share = price / totalMembersCount;
                    state.members.forEach(m => {
                        stats[m].earned += share;
                    });
                    if (hintElem) hintElem.innerText = `💡 全體 ${totalMembersCount} 人平分，每人得 ${formatNumber(Math.round(share))} 元`;
                } else {
                    // 情況B：有人購買
                    stats[buyer].spent += price; // 買家付全額
                    
                    const nonBuyers = state.members.filter(m => m !== buyer);
                    const nonBuyersCount = nonBuyers.length;

                    if (nonBuyersCount === 0) {
                        if (hintElem) hintElem.innerText = `⚠️ 唯一成員自買，無人可分`;
                    } else {
                        const share = price / nonBuyersCount;
                        nonBuyers.forEach(m => {
                            stats[m].earned += share;
                        });
                        if (hintElem) hintElem.innerText = `💡 買家 ${buyer} 實付，其餘 ${nonBuyersCount} 人平分，每人得 ${formatNumber(Math.round(share))} 元`;
                    }
                }
            });

            // 計算最終淨收支 (net = earned - spent)
            // 若為買家：earned 為 0 (假設他沒分到這筆錢)，net = 0 - spent = -spent
            Object.keys(stats).forEach(m => {
                stats[m].net = stats[m].earned - stats[m].spent;
            });

            // 渲染總表
            const tbody = document.getElementById('summaryTableBody');
            if (state.members.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-400">尚無隊員資料</td></tr>`;
                return;
            }

            tbody.innerHTML = state.members.map(m => {
                const data = stats[m];
                const netColor = data.net > 0 ? 'text-emerald-600 font-bold' : (data.net < 0 ? 'text-rose-600 font-bold' : 'text-slate-600');
                const netSign = data.net > 0 ? '+' : '';
                return `
                    <tr class="hover:bg-slate-50/80 transition">
                        <td class="py-3 px-4 font-semibold text-slate-800">${m}</td>
                        <td class="py-3 px-4 text-slate-600">${data.spent > 0 ? '-' + formatNumber(Math.round(data.spent)) + ' 元' : '-'}</td>
                        <td class="py-3 px-4 text-slate-600">${data.earned > 0 ? '+' + formatNumber(Math.round(data.earned)) + ' 元' : '-'}</td>
                        <td class="py-3 px-4 text-right ${netColor}">${netSign}${formatNumber(Math.round(data.net))} 元</td>
                    </tr>
                `;
            }).join('');

            generateReportText(stats);
            saveToLocalStorage();
        }

        // 生成複製文字
        function generateReportText(stats) {
            let text = `【 ⚔️ 隊伍寶物分贓結算明細 】\n`;
            text += `----------------------------------------\n`;
            text += `👥 參與成員 (${state.members.length}人)：${state.members.join(', ')}\n`;
            text += `💎 寶物登記 (${state.items.length}件)：\n`;
            state.items.forEach((item, index) => {
                text += `  ${index + 1}. ${item.name} | 價格: ${formatNumber(item.price)}元 | ${item.buyer ? '買家: ' + item.buyer : '全體平分'}\n`;
            });
            text += `----------------------------------------\n`;
            text += `📊 最終結算總表 (淨收支):\n`;
            state.members.forEach(m => {
                const d = stats[m];
                const sign = d.net > 0 ? '+' : '';
                text += `• ${m}: 買裝花費 ${formatNumber(Math.round(d.spent))} | 分紅收益 ${formatNumber(Math.round(d.earned))} | 淨收支 ${sign}${formatNumber(Math.round(d.net))}元\n`;
            });
            text += `----------------------------------------\n`;
            text += `💡 結算邏輯說明：數值為「+」代表實領金額，數值為「-」代表需補繳金額。`;

            document.getElementById('reportOutput').value = text;
        }

        function copyDiscordReport() {
            const textarea = document.getElementById('reportOutput');
            textarea.select();
            document.execCommand('copy');
            alert('✅ 結算明細已成功複製到剪貼簿，可直接貼到聊天頻道！');
        }
    </script>
</body>
</html>
